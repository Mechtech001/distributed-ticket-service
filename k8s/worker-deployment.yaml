apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  labels:
    app: ticket-worker
spec:
  replicas: 1  # We can easily scale this to 3 or 5 later to handle booking spikes!
  selector:
    matchLabels:
      app: ticket-worker
  template:
    metadata:
      labels:
        app: ticket-worker
    spec:
      initContainers:
      - name: wait-for-kafka
        image: busybox:latest
        command: ['sh', '-c']
        args:
        - |
          echo "Waiting for Kafka to be ready..."
          until nc -z kafka 9092; do
            echo "Kafka is unavailable - sleeping"
            sleep 2
          done
          echo "Kafka is up - proceeding with startup"
      containers:
        - name: worker-service
          image: ticket-worker:latest  # We will link Minikube to your local images shortly
          imagePullPolicy: Never        # Tells K8s to look locally instead of Docker Hub
          ports:
            - containerPort: 5001      # The internal port your worker runs on
          env:
            - name: MONGO_URI
              value: "mongodb://mongo-service:27017/tickets"
            - name: KAFKA_BROKERS
              value: "kafka-service:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: worker-service
spec:
  selector:
    app: ticket-worker
  ports:
    - protocol: TCP
      port: 5001        # The stable port other containers will call
      targetPort: 5001  # The actual port inside the container
  type: ClusterIP      # Internal-only network routing