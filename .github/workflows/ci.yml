name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gateway-service/package-lock.json
      - run: npm ci
        working-directory: gateway-service
      - run: npm test
        working-directory: gateway-service
